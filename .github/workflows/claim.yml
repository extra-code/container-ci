# Run once by hand after the first release made the package public. The claim opens a pull
# request in the OCX index.
name: claim

on: workflow_dispatch

permissions: {}

jobs:
  claim:
    name: claim the package in the OCX index
    # The release environment's token must never reach a workflow edited on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: 0.6.5
          project: ""
          cache: false
      - name: Claim the package
        env:
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          OCX_INDEX_FORK: ${{ vars.OCX_INDEX_FORK }}
        run: ocx package claim --repository oci://ghcr.io/extra-code/container-ci --fork "$OCX_INDEX_FORK" extra-code/container-ci
