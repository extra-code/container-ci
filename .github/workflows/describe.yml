# Publishes the OCX catalog description of ghcr.io/extra-code/container-ci as its __ocx.desc tag.
# The front matter of packaging/describe/README.md carries the title, description and keywords;
# packaging/describe/logo.svg is the catalog logo.
name: describe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/describe/**

permissions: {}

concurrency:
  group: describe
  cancel-in-progress: false

jobs:
  describe:
    name: publish the package description
    # packages:write must never reach a workflow edited on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocx-sh/setup-ocx@eaeb6788da6191868a1310cc2bba93233b586369 # v1.4.1
        with:
          version: 0.6.8
          project: ""
          cache: false
      - name: Push the description
        env:
          OCX_NO_UPDATE_CHECK: 1
          OCX_AUTH_ghcr_io_TYPE: basic
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ocx package description push \
            --readme packaging/describe/README.md \
            --logo packaging/describe/logo.svg \
            ghcr.io/extra-code/container-ci
