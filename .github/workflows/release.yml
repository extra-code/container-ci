# Publishes a GitHub release for a Go-style semver tag such as v1.0.0, which is the form
# `go install ...@v1.0.0` resolves. The release notes are the CHANGELOG.md section headed
# `## [1.0.0]`, so the section must exist before the tag is pushed. The binary reports the tag
# (v1.0.0) and the release asset names carry the version without the v.
#
# After the GitHub release, the publish job pushes the OCX package ghcr.io/extra-code/container-ci
# with the version without the v, signed keyless by this workflow. A stable release also moves the
# rolling tags (1.0, 1, latest) and, when OCX_INDEX_ANNOUNCE is 'true', is announced to the OCX index.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.digest.outputs.version }}
      artifact-id: ${{ steps.upload-package.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      metadata-sha256: ${{ steps.digest.outputs.metadata-sha256 }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The tag name reaches shell commands and the build stamp, so refuse anything but semver.
      - name: Validate the tag
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "tag '$TAG' is not vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$TAG is not an ancestor of origin/main" >&2
            exit 1
          }
      - name: Extract the release notes
        run: |
          mkdir dist
          awk -v ver="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "## [" ver "]") == 1; next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md >dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md || {
            echo "no CHANGELOG.md section for ${TAG#v}" >&2
            exit 1
          }
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: 0.6.5
          groups: build
      - name: Build the binary and the OCX package
        run: ocx exec -g build -- task package VERSION="$TAG"
      - name: Check the version stamp
        run: |
          got=$(build/bin/gitlab-container-executor version)
          [ "$got" = "$TAG" ] || { echo "binary reports '$got', expected '$TAG'" >&2; exit 1; }
      - name: Package
        run: |
          name="gitlab-container-executor_${TAG#v}_darwin_arm64"
          tar -C build/bin -czf "dist/$name.tar.gz" gitlab-container-executor
          (cd dist && shasum -a 256 "$name.tar.gz" >checksums.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Record the OCX package digests
        id: digest
        run: |
          version="${TAG#v}"
          archive="build/package/container-ci-${version}.tar.xz"
          metadata="build/package/container-ci-${version}-metadata.json"
          [ -f "$archive" ] && [ -f "$metadata" ] || {
            echo "expected $archive and $metadata" >&2
            exit 1
          }
          {
            echo "version=$version"
            echo "sha256=$(shasum -a 256 "$archive" | cut -d' ' -f1)"
            echo "metadata-sha256=$(shasum -a 256 "$metadata" | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-package
        with:
          name: ocx-package
          path: |
            build/package/container-ci-*.tar.xz
            build/package/container-ci-*-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" \
            "dist/gitlab-container-executor_${TAG#v}_darwin_arm64.tar.gz" dist/checksums.txt \
            --verify-tag --title "$TAG" --notes-file dist/notes.md $prerelease
  publish:
    name: publish the OCX package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: publish-container-ci
      cancel-in-progress: false
    permissions:
      packages: write
      id-token: write
    outputs:
      tags: ${{ steps.push.outputs.tags }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          path: ocx-package
      # The archive that reaches the registry must be the one the release job built.
      - name: Check the archive and metadata SHA-256
        env:
          EXPECTED_ARCHIVE: ${{ needs.release.outputs.sha256 }}
          EXPECTED_METADATA: ${{ needs.release.outputs.metadata-sha256 }}
        run: |
          archive="ocx-package/container-ci-${VERSION}.tar.xz"
          metadata="ocx-package/container-ci-${VERSION}-metadata.json"
          for f in "$archive" "$metadata"; do
            [ -f "$f" ] || { echo "error: $f is missing" >&2; exit 1; }
          done
          actual="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED_ARCHIVE" ] || {
            echo "error: archive SHA-256 $actual does not match the release job's $EXPECTED_ARCHIVE" >&2
            exit 1
          }
          actual="$(shasum -a 256 "$metadata" | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED_METADATA" ] || {
            echo "error: metadata SHA-256 $actual does not match the release job's $EXPECTED_METADATA" >&2
            exit 1
          }
          echo "ARCHIVE=$archive" >>"$GITHUB_ENV"
          echo "METADATA=$metadata" >>"$GITHUB_ENV"
      # No repository config and no cache reach the job that holds the write tokens.
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: 0.6.5
          project: ""
          cache: false
      - name: Push and sign the package
        id: push
        env:
          OCX_AUTH_ghcr_io_TYPE: basic
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -- -p darwin/arm64 -m "$METADATA" --ci-annotations=github --sign
          # A pre-release never moves the rolling tags.
          case "$VERSION" in *-*) ;; *) set -- "$@" --cascade ;; esac
          rm -f tags.txt
          ocx package push "$@" --tags-file tags.txt -i "ghcr.io/extra-code/container-ci:${VERSION}" "$ARCHIVE"
          echo "tags=$(paste -sd, tags.txt)" >>"$GITHUB_OUTPUT"
      # Anonymous on purpose: with GITHUB_TOKEN, ghcr.io answers the referrers endpoint with 401
      # instead of 404, so ocx never falls back to the sha256-<digest> tag. It also checks what users
      # see. Right after a push the anonymous call can answer 401 too and ocx exits 69, so only 69 retries.
      - name: Verify the pushed signature
        run: |
          for attempt in $(seq 1 20); do
            rc=0
            ocx package verify -p darwin/arm64 \
              --certificate-identity "https://github.com/extra-code/container-ci/.github/workflows/release.yml@refs/tags/v${VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/extra-code/container-ci:${VERSION}" || rc=$?
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 69 ] || exit "$rc"
            echo "attempt ${attempt}: the registry is not ready, retrying in 30 s" >&2
            sleep 30
          done
          exit 69

  announce:
    name: announce the package to the OCX index
    needs: publish
    # OCX_INDEX_ANNOUNCE must be a repository or organization variable: a job-level if cannot read
    # environment variables, so one set on the release environment never matches.
    if: vars.OCX_INDEX_ANNOUNCE == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: 0.6.5
          project: ""
          cache: false
      - name: Announce the package
        env:
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
          OCX_INDEX_FORK: ${{ vars.OCX_INDEX_FORK }}
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | tr ',' '\n' >tags.txt
          ocx package announce --tags-file tags.txt --fork "$OCX_INDEX_FORK" extra-code/container-ci
